[project]
name = "refund-dispatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
